name: Release S-UI

on:
  workflow_dispatch:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: read

env:
  NODE_VERSION: "26"
  CRONET_GO_REPO: https://github.com/sagernet/cronet-go.git

jobs:
  test:
    # Skipped on a tag and on a published release: both ship a commit that
    # already went through this gate on main.
    if: ${{ github.event_name != 'release' && !startsWith(github.ref, 'refs/tags/') }}
    uses: ./.github/workflows/test.yml

  build-frontend:
    needs: test
    # A skipped gate is not a failed one, so the build still runs on a tag.
    if: ${{ always() && needs.test.result != 'failure' && needs.test.result != 'cancelled' }}
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository (frontend only)
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # node_modules itself, so a lockfile that did not change skips npm ci.
      # setup-node's cache above only keeps the tarballs npm ci unpacks.
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache/restore@v6
        with:
          path: frontend/node_modules
          key: node-modules-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install frontend dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci
        working-directory: frontend

      - name: Save node_modules
        if: github.ref == 'refs/heads/main' && steps.node-modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: frontend/node_modules
          key: ${{ steps.node-modules.outputs.cache-primary-key }}

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Upload frontend dist
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist/

  build-linux:
    name: build-${{ matrix.arch }}
    needs: build-frontend
    # The `always()` on build-frontend only rescues that job: a skipped `test`
    # keeps propagating down the graph unless every dependent repeats it.
    if: ${{ always() && needs.build-frontend.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, "386"]
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download frontend dist
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: web/html

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          cache: false
          go-version-file: go.mod

      - name: Locate Go caches
        id: go-env
        run: |
          echo "modcache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "gocache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"

      - name: Restore Go module cache
        id: go-mod-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.go-env.outputs.modcache }}
          key: go-mod-${{ runner.os }}-${{ hashFiles('go.sum') }}

      # Per platform: every target compiles its own objects. Keyed on what
      # decides the dependency objects, which are most of the build; a stale
      # copy of s-ui's own packages costs only their recompile.
      - name: Restore Go build cache
        id: go-build-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.go-env.outputs.gocache }}
          key: go-build-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('go.sum', 'build-tags.sh') }}
          restore-keys: go-build-${{ runner.os }}-${{ matrix.arch }}-

      - name: Resolve cronet-go commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(go list -m -f '{{.Version}}' github.com/sagernet/cronet-go)
          SHORT=${VERSION##*-}
          # The module proxy records the full commit of a pseudo-version and
          # has no rate limit; the unauthenticated GitHub API answered 403
          # once the shared runner IPs used up their quota.
          FULL=$(curl -fsSL "https://proxy.golang.org/github.com/sagernet/cronet-go/@v/${VERSION}.info" | jq -r '.Origin.Hash // empty' || true)
          if [ -z "$FULL" ]; then
            FULL=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/SagerNet/cronet-go/commits/${SHORT}" | jq -r '.sha')
          fi
          [ -n "$FULL" ] && [ "$FULL" != "null" ] || { echo "could not resolve cronet-go commit ${SHORT}" >&2; exit 1; }
          case "$FULL" in "$SHORT"*) ;; *) echo "cronet-go commit $FULL does not match ${SHORT}" >&2; exit 1 ;; esac
          echo "cronet-go: $FULL"
          echo "CRONET_COMMIT=$FULL" >> "$GITHUB_ENV"

      # Naive platforms: use cronet toolchain only (no Bootlin).
      - name: Clone cronet-go (cronet toolchain for naive)
        run: |
          set -e
          git init ~/cronet-go
          git -C ~/cronet-go remote add origin ${{ env.CRONET_GO_REPO }}
          git -C ~/cronet-go fetch --depth=1 origin "${{ env.CRONET_COMMIT }}"
          git -C ~/cronet-go checkout FETCH_HEAD
          git -C ~/cronet-go submodule update --init --recursive --depth=1

      - name: Regenerate Debian keyring (cronet sysroot)
        run: |
          set -e
          rm -f ~/cronet-go/naiveproxy/src/build/linux/sysroot_scripts/keyring.gpg
          cd ~/cronet-go
          GPG_TTY=/dev/null ./naiveproxy/src/build/linux/sysroot_scripts/generate_keyring.sh

      - name: Cache Chromium toolchain
        id: cache-chromium-toolchain
        uses: actions/cache@v6
        with:
          path: |
            ~/cronet-go/naiveproxy/src/third_party/llvm-build/
            ~/cronet-go/naiveproxy/src/gn/out/
            ~/cronet-go/naiveproxy/src/chrome/build/pgo_profiles/
            ~/cronet-go/naiveproxy/src/out/sysroot-build/
          key: chromium-toolchain-${{ matrix.arch }}-musl-${{ env.CRONET_COMMIT }}

      - name: Build cronet lib and set toolchain env (CC, CXX, CGO_LDFLAGS, PATH)
        run: |
          set -e
          cd ~/cronet-go
          go run ./cmd/build-naive --target=linux/${{ matrix.arch }} --libc=musl download-toolchain
          go run ./cmd/build-naive --target=linux/${{ matrix.arch }} --libc=musl env | while IFS= read -r line; do
            line="${line#export }"
            [[ -z "$line" ]] && continue
            echo "$line" >> $GITHUB_ENV
          done

      - name: Set Go build env (all platforms)
        run: |
          echo "CGO_ENABLED=1" >> $GITHUB_ENV
          echo "GOOS=linux" >> $GITHUB_ENV
          echo "GOARCH=${{ matrix.arch }}" >> $GITHUB_ENV

      - name: Download Go modules (with retry)
        run: |
          set -e
          export GODEBUG=http2client=0
          for i in 1 2 3 4 5; do
            if go mod download -x; then
              echo "go mod download succeeded"
              exit 0
            fi
            echo "go mod download failed (attempt $i), retrying in $((i * 10))s..."
            sleep $((i * 10))
          done
          echo "go mod download failed after 5 attempts" >&2
          exit 1

      - name: Save Go module cache
        if: matrix.arch == 'amd64' && steps.go-mod-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.go-env.outputs.modcache }}
          key: ${{ steps.go-mod-cache.outputs.cache-primary-key }}

      - name: Build s-ui
        run: |
          set -e
          . ./build-tags.sh
          TAGS=$(tags_for release)
          LDFLAGS=$(ldflags_for release)
          go build -ldflags="$LDFLAGS -linkmode external -extldflags '-static'" -tags "$TAGS" -o sui main.go
          file sui
          case "${{ matrix.arch }}" in
            amd64) expected="Advanced Micro Devices X86-64" ;;
            386) expected="Intel 80386" ;;
          esac
          readelf -h sui | grep -F "$expected"
          if readelf -l sui | grep -q INTERP; then echo "Unexpected ELF interpreter"; exit 1; fi

          mkdir s-ui
          cp sui s-ui/
          cp s-ui.service s-ui/
          cp s-ui.sh s-ui/

      # Only main saves: a tag's cache is scoped to that tag and no later run
      # could read it.
      - name: Save Go build cache
        if: github.ref == 'refs/heads/main' && steps.go-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.go-env.outputs.gocache }}
          key: ${{ steps.go-build-cache.outputs.cache-primary-key }}

      - name: Package
        run: tar -zcvf s-ui-linux-${{ matrix.arch }}.tar.gz s-ui

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: s-ui-linux-${{ matrix.arch }}
          path: ./s-ui-linux-${{ matrix.arch }}.tar.gz
          retention-days: 30

  publish:
    needs: build-linux
    if: ${{ always() && needs.build-linux.result == 'success' && github.ref_type == 'tag' }}
    runs-on: ubuntu-26.04
    concurrency: release-${{ github.ref }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: s-ui-linux-*
          merge-multiple: true
          path: dist
      - name: Verify and publish Debian/Linux x86 release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" == "v$(cat config/version)" ]]
          bash -n install.sh
          cp install.sh dist/
          cd dist
          files=(install.sh s-ui-linux-386.tar.gz s-ui-linux-amd64.tar.gz)
          for archive in "${files[@]:1}"; do
            tar tzf "$archive" | grep -Fx 's-ui/sui'
          done
          sha256sum "${files[@]}" > SHA256SUMS
          sha256sum --check SHA256SUMS
          if gh release view "$TAG" --json isDraft >/dev/null 2>&1; then
            [[ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" == true ]]
          else
            gh release create "$TAG" --verify-tag --draft --title "S-UI Custom $TAG" --generate-notes
          fi
          gh release upload "$TAG" "${files[@]}" SHA256SUMS --clobber
          gh release view "$TAG" --json assets > "$RUNNER_TEMP/assets.json"
          python3 - "$RUNNER_TEMP/assets.json" "${files[@]}" SHA256SUMS <<'PYTHON'
          import hashlib, json, sys
          from pathlib import Path
          assets = json.loads(Path(sys.argv[1]).read_text())["assets"]
          remote = {a["name"]: a["digest"] for a in assets if a["state"] == "uploaded"}
          local = {}
          for name in sys.argv[2:]:
              with open(name, "rb") as f:
                  local[name] = "sha256:" + hashlib.file_digest(f, "sha256").hexdigest()
          if remote != local or len(assets) != len(local):
              sys.exit("Release asset list or checksum mismatch")
          PYTHON
          gh release edit "$TAG" --draft=false --latest
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          curl -fsSL --retry 5 --retry-all-errors "$base/SHA256SUMS" | cmp - SHA256SUMS
          for archive in "${files[@]:1}"; do
            curl -fsSL --retry 5 --retry-all-errors --range 0-31 -o /dev/null "$base/$archive"
          done
